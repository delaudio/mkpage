name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary Artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          STAGE="mkpage-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/mkpage.exe" "$STAGE/"
            cp README.md LICENSE "$STAGE/"
            7z a "$STAGE.zip" "$STAGE"
          else
            cp "target/${{ matrix.target }}/release/mkpage" "$STAGE/"
            cp README.md LICENSE "$STAGE/"
            tar czvf "$STAGE.tar.gz" "$STAGE"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkpage-${{ matrix.target }}
          path: mkpage-*.*
