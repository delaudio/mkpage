[package]
name = "mkpage"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A static-site generator for terminal-minded websites"
license = "MIT"
repository = "https://github.com/delaudio/mkpage"
keywords = ["static-site-generator", "tui", "cli", "rust"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
minijinja = "2.16"
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "=0.3.36", features = ["macros", "parsing"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.15"
